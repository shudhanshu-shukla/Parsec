<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Parsec</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 40px #00000015;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 10px;
      background: #050509;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 3px;
      margin: 0;
    }

    p {
      color: #777;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #242521;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #3b3c35;
    }

    a {
      display: block;
      margin-top: 20px;
      color: #9c8050;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="brand">
      <img src="parsec-logo.png" alt="Parsec Logo">
      <h1>PARSEC</h1>
    </div>

    <p>Welcome back, creator.</p>

    <form>
      <input type="email" placeholder="Email address" required>
      <input type="password" placeholder="Password" required>

      <button type="submit">Continue →</button>
    </form>

    <a href="index.html">← Back to Home</a>

  </div>

</body>
</html>
