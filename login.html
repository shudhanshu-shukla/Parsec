<div class="min-h-screen grid grid-cols-1 lg:grid-cols-2 bg-[#0B0C10] text-white">
  
  <!-- Left Side: Branding & Showcase -->
  <div class="hidden lg:flex relative flex-col justify-between p-12 overflow-hidden border-r border-white/10">
    <!-- Ambient Gradient Blur Background -->
    <div class="absolute -top-24 -left-24 w-96 h-96 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-blue-500/30 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Logo -->
    <div class="z-10">
      <img src="parsec-logo.png" alt="Parsec Logo" class="h-10" />
    </div>

    <!-- Center Hero Graphics / Intro -->
    <div class="z-10 max-w-md my-auto">
      <h2 class="text-4xl font-extrabold tracking-tight mb-4">
        AI Video Editing <br />
        <span class="bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent">
          Reimagined.
        </span>
      </h2>
      <p class="text-gray-400 text-sm tracking-widest uppercase">
        Create • Edit • Inspire
      </p>
    </div>

    <!-- Footer Quote/Badge -->
    <div class="z-10 p-4 rounded-xl bg-white/5 backdrop-blur-md border border-white/10 max-w-sm">
      <p class="text-xs text-gray-300">"Parsec cut our video rendering and editing workflow time in half."</p>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="flex items-center justify-center p-8 sm:p-12">
    <div class="w-full max-w-md space-y-6">
      
      <div class="space-y-2 text-center sm:text-left">
        <h1 class="text-3xl font-bold">Sign In</h1>
        <p class="text-sm text-gray-400">Welcome back! Please enter your details.</p>
      </div>

      <!-- Social Logins -->
      <button class="w-full flex items-center justify-center gap-3 py-2.5 px-4 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 transition">
        <span>Continue with Google</span>
      </button>

      <div class="relative flex items-center justify-center my-4">
        <div class="w-full border-t border-white/10"></div>
        <span class="absolute bg-[#0B0C10] px-3 text-xs text-gray-500 uppercase tracking-wider">OR</span>
      </div>

      <!-- Form Inputs -->
      <form class="space-y-4" onsubmit="event.preventDefault();">
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Email address</label>
          <input type="email" placeholder="name@company.com" class="w-full px-4 py-2.5 rounded-lg bg-white/5 border border-white/10 text-sm focus:outline-none focus:border-purple-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Password</label>
          <input type="password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg bg-white/5 border border-white/10 text-sm focus:outline-none focus:border-purple-500 transition" />
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-gray-400 cursor-pointer">
            <input type="checkbox" class="rounded bg-white/10 border-white/20 text-purple-600 focus:ring-0" />
            Remember me
          </label>
          <a href="#" class="text-purple-400 hover:text-purple-300">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3 rounded-lg font-semibold text-white bg-gradient-to-r from-purple-600 to-blue-500 hover:opacity-95 shadow-lg shadow-purple-500/25 transition">
          Sign In
        </button>
      </form>

      <p class="text-xs text-center text-gray-400">
        Don't have an account? <a href="#" class="text-purple-400 hover:text-purple-300 font-medium">Sign up for free</a>
      </p>

    </div>
  </div>

</div>
